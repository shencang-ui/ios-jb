name: Build Tweaks  # v5: DemoTweak (rootless) + iOS26Clock (roothide-compatible)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths:
      - 'DemoTweak/**'
      - 'iOS26Clock/**'
      - '.github/workflows/**'
  workflow_dispatch:

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot rsync curl perl git libxml2 zstd xz-utils

      - name: Cache Theos + SDK + Toolchain
        uses: actions/cache@v4
        with:
          path: theos
          key: theos-iphoneos16.5-x86_64-v2

      - name: Install Theos if not cached
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -d "$THEOS/toolchain/linux/iphone/bin" ]; then
            git clone --recursive https://github.com/theos/theos.git "$THEOS"
            mkdir -p "$THEOS/toolchain"
            echo "Downloading iOS toolchain (Apple clang + ld64, supports arm64e)..."
            curl -fsSL --retry 5 \
              https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz \
              | tar -xJ -C "$THEOS/toolchain"
            echo "Downloading iPhoneOS SDK..."
            export THEOS
            "$THEOS/bin/install-sdk" latest
          fi

      - name: Verify arm64e support
        run: |
          "$THEOS/toolchain/linux/iphone/bin/clang" --version | head -1
          file "$THEOS/toolchain/linux/iphone/bin/ld"

      - name: Build DemoTweak (rootless, stock substrate link)
        id: build-demo
        continue-on-error: true
        run: |
          export PATH="$THEOS/bin:$PATH"
          export THEOS_PACKAGE_SCHEME=rootless
          cd DemoTweak
          set -o pipefail
          make messages=yes package FINALPACKAGE=1 ARCHS="arm64 arm64e" 2>&1 | tee ../ci-demo.log

      # roothide 兼容关键步骤：substrate 的 tbd install-name 改为
      # @loader_path/.jbroot/usr/lib/libsubstrate.dylib，否则 tweak 在
      # roothide 设备上无法加载（交接文档记录的根因）。
      - name: Patch substrate tbd for roothide
        run: |
          grep -rl "install-name:.*@rpath/CydiaSubstrate.framework/CydiaSubstrate" \
            "$THEOS/vendor/lib" | while read -r f; do
            sed -i "s|@rpath/CydiaSubstrate.framework/CydiaSubstrate|@loader_path/.jbroot/usr/lib/libsubstrate.dylib|" "$f"
            echo "patched: $f"
          done
          grep -h install-name "$THEOS/vendor/lib/iphone/rootless/libsubstrate.tbd" \
            "$THEOS/vendor/lib/iphone/rootless/CydiaSubstrate.framework/CydiaSubstrate.tbd"

      - name: Build iOS26Clock (arm64 + arm64e, roothide-compatible)
        id: build-clock
        continue-on-error: true
        run: |
          export PATH="$THEOS/bin:$PATH"
          export THEOS_PACKAGE_SCHEME=rootless
          cd iOS26Clock
          set -o pipefail
          make messages=yes package FINALPACKAGE=1 ARCHS="arm64 arm64e" 2>&1 | tee ../ci-clock.log

      - name: Verify iOS26Clock deb (13+ self checks)
        if: always()
        continue-on-error: true
        run: |
          DEB=$(ls -t iOS26Clock/packages/*.deb 2>/dev/null | head -1)
          if [ -n "$DEB" ]; then
            bash iOS26Clock/verify_deb.sh "$DEB" | tee verify-clock.log
          else
            echo "::error title=verify::no iOS26Clock deb produced" | tee verify-clock.log
          fi

      - name: Emit build log tail as annotation (iOS26Clock)
        if: always()
        continue-on-error: true
        run: |
          if [ -f ci-clock.log ]; then
            TAIL=$(tail -c 3000 ci-clock.log | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::${{ steps.build-clock.outcome == 'failure' && 'error' || 'notice' }} title=ios26clock-log-tail::$TAIL"
          else
            echo "::error title=ios26clock-log-tail::no ci-clock.log produced"
          fi
          if [ -f verify-clock.log ]; then
            echo "verify summary:"
            cat verify-clock.log
          fi

      - name: Upload debs (artifacts)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: debs
          path: |
            DemoTweak/packages/*.deb
            iOS26Clock/packages/*.deb
          if-no-files-found: warn

      - name: Upload build logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ci-demo.log
            ci-clock.log
            verify-clock.log
          if-no-files-found: ignore

      - name: Upload to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/') && steps.build-clock.outcome == 'success'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          files: |
            iOS26Clock/packages/*.deb
            DemoTweak/packages/*.deb

      - name: Mark run as failed if any build failed
        if: steps.build-demo.outcome == 'failure' || steps.build-clock.outcome == 'failure'
        run: exit 1
