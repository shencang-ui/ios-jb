name: Build arm64e Tweak

on:
  push:
    branches: [ main ]
    paths:
      - 'DemoTweak/**'
      - '.github/workflows/**'
  workflow_dispatch:

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot rsync curl perl git libxml2 zstd

      - name: Cache Theos + SDK + Toolchain
        uses: actions/cache@v4
        with:
          path: theos
          key: theos-iphoneos16.5-x86_64

      - name: Install Theos if not cached
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -d "$THEOS/toolchain/linux/iphone/bin" ]; then
            git clone --recursive https://github.com/theos/theos.git "$THEOS"
            mkdir -p "$THEOS/toolchain"
            echo "Downloading iOS toolchain (Apple clang + ld64, supports arm64e)..."
            curl -fsSL --retry 5 \
              https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz \
              | tar -xJ -C "$THEOS/toolchain"
            echo "Downloading iPhoneOS SDK..."
            export THEOS
            "$THEOS/bin/install-sdk" latest
          fi

      - name: Verify arm64e support
        run: |
          "$THEOS/toolchain/linux/iphone/bin/clang" --version | head -1
          file "$THEOS/toolchain/linux/iphone/bin/ld"

      - name: Build (arm64 + arm64e, rootless)
        id: build
        continue-on-error: true
        run: |
          export PATH="$THEOS/bin:$PATH"
          export THEOS_PACKAGE_SCHEME=rootless
          cd DemoTweak
          make clean
          set -o pipefail
          make package FINALPACKAGE=1 2>&1 | tee ../ci-build.log

      - name: Upload deb (on success)
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: DemoTweak-rootless-arm64e
          path: DemoTweak/packages/*.deb

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-build-log
          path: ci-build.log

      - name: Upload to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/') && steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          files: DemoTweak/packages/*.deb

      - name: Mark run as failed if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
