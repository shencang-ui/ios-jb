name: Build iOS26Clock

# 在 GitHub 的 macOS 运行器上构建 —— 那边的 ld64 是现代版本，
# 天生产出 arm64e「新 ABI」(cpusubtype 0x80000002)，
# 从根上避免 Linux 老工具链导致的字面量/PAC 崩溃问题。

on:
  push:
    branches: [ ios26clock ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 theos
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "PATH=$THEOS/bin:$PATH" >> "$GITHUB_ENV"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          echo "theos 就位: $(ls "$THEOS" | head -5 | tr '\n' ' ')"

      - name: 安装 iOS SDK (16.5)
        run: |
          set -euo pipefail
          # theos 是 --recursive 克隆的，sdks 子模块（含全部 SDK）已在 $THEOS/sdks；
          # 之前在这里重复 clone 同一目录导致 exit 128，改为校验 + 兜底全量克隆
          if [ ! -d "$THEOS/sdks/iPhoneOS16.5.sdk" ]; then
            rm -rf "$THEOS/sdks"
            git clone --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks"
          fi
          ls -d "$THEOS/sdks/iPhoneOS16.5.sdk"
          du -sh "$THEOS/sdks/iPhoneOS16.5.sdk"

      - name: 安装 ldid / dpkg
        run: |
          brew install ldid || brew install --HEAD ldid || true
          brew install dpkg || true
          which ldid || echo "!! 没有 ldid，签名步骤会失败"

      - name: 套用 roothide 魔改
        run: |
          set -euo pipefail
          mkdir -p "$THEOS/vendor/mod" "$THEOS/vendor/lib/iphone" "$THEOS/include"
          cp -r  ci/theos-vendor/vendor/mod/roothide        "$THEOS/vendor/mod/"
          cp -r  ci/theos-vendor/vendor/lib/iphone/roothide "$THEOS/vendor/lib/iphone/"
          cp -r  ci/theos-vendor/include/.                  "$THEOS/include/"
          echo "--- 套用结果 ---"
          ls "$THEOS/vendor/mod/roothide"
          ls "$THEOS/vendor/lib/iphone/roothide"
          ls "$THEOS/include/roothide.h" "$THEOS/include/CydiaSubstrate"

      - name: 显示工具链版本（关键：看 ld64）
        run: |
          set -euo pipefail
          echo "== xcrun ld =="
          xcrun --find ld || true
          (xcrun ld -v 2>&1 | head -3) || true
          echo "== clang =="
          xcrun clang --version | head -3

      - name: 构建
        run: |
          set -euo pipefail
          cd iOS26Clock
          make package ARCHS="arm64e" TARGET="iphone:clang:16.5:14.0" FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
          ls -la packages/

      - name: 校验 arm64e ABI（必须是 0x80000002，否则设备上会崩）
        run: |
          set -euo pipefail
          DEB=$(ls -t iOS26Clock/packages/*.deb | head -1)
          echo "deb: $DEB"
          work=$(mktemp -d)
          dpkg-deb -R "$DEB" "$work/root" 2>/dev/null || (cd "$work" && ar x "$OLDPWD/$DEB" && tar xf data.tar.* -C root 2>/dev/null || true)
          python3 - "$work" <<'PY'
          import glob, os, struct, sys
          root = sys.argv[1]
          files = glob.glob(os.path.join(root, '**', '*.dylib'), recursive=True) + \
                  glob.glob(os.path.join(root, '**', 'iOS26ClockPrefs'), recursive=True)
          bad = []
          for p in files:
              if not os.path.isfile(p):
                  continue
              with open(p, 'rb') as f:
                  head = f.read(16)
              if len(head) < 16:
                  continue
              cpu, sub = struct.unpack_from('<II', head, 4)
              name = os.path.basename(os.path.normpath(p))
              print("  %-24s cpusubtype=0x%08x" % (name, sub))
              if sub != 0x80000002:
                  bad.append((name, sub))
          if bad:
              print("\n!! 以下产物不是 arm64e 新 ABI，设备上会崩：")
              for n, s in bad:
                  print("   %s -> 0x%08x" % (n, s))
              sys.exit(1)
          print("\n== ABI 校验通过：全部是 arm64e 新 ABI (0x80000002) ==")
          PY

      - name: 上传 deb
        uses: actions/upload-artifact@v4
        with:
          name: iOS26Clock-deb
          path: iOS26Clock/packages/*.deb
          if-no-files-found: error
